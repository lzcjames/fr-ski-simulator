name: New v2 resort IGN integration
on:
  workflow_dispatch:
    inputs:
      resort:
        description: Existing resort profile slug
        type: string
        required: true
        default: galibier-thabor
  push:
    paths:
      - 'resorts/galibier-thabor/config.json'
      - '.github/workflows/onboard-v2-resort.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RESORT: ${{ inputs.resort || 'galibier-thabor' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate profile and prepare pinned Skill
        run: |
          CONFIG=$(python scripts/resort_config.py "$RESORT")
          echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"
          SKILL_SHA=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["skillCommit"])' "$CONFIG")
          git clone https://github.com/awoele/ski-resort-to-game.git .work/skill
          git -C .work/skill checkout --detach "$SKILL_SHA"
          python -m pip install rasterio Pillow
          python tests/test_generator.py -v
          python tests/test_layered_terrain.py -v
          python tests/test_ign_terrain.py -v
          python tests/test_grid_codec.py -v
      - name: Download fresh real OSM data
        run: |
          mkdir -p .work/input
          BBOX=$(python -c 'import json,sys; print(",".join(map(str,json.load(open(sys.argv[1]))["bbox"])))' "$CONFIG")
          python .work/skill/scripts/fetch_osm.py --bbox "$BBOX" --out .work/input/osm.json
      - name: Fetch and cross-check 5/20/60 metre IGN elevation grids
        run: |
          python scripts/layered_terrain.py --config "$CONFIG" --skill .work/skill --osm .work/input/osm.json --work .work/terrain --ign-wms
      - name: Preserve geographic source data before compiling
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RESORT }}-ign-data
          path: |
            .work/input/osm.json
            .work/terrain/*-ign.tif
            .work/terrain/layered-data.json
            .work/terrain/layers-report.json
            .work/terrain/data-report.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/download-artifact@v4
        with:
          name: engine-v2-pinned-upstream
          path: .work/upstream
          run-id: '45914214557'
          github-token: ${{ github.token }}
      - name: Check out previously validated v2.0 compiler
        uses: actions/checkout@v4
        with:
          ref: 4dbbcd12be11f724d641d925b6df224895784d99
          path: .work/baseline
      - name: Build v2.0 lossless candidate using known engine
        run: |
          python .work/baseline/scripts/engine_v2.py --template .work/upstream/avoriaz-current.review.html --config "$CONFIG" --data .work/terrain/layered-data.json --out ".work/v2/$RESORT.html" --engine-out .work/shared-v2.html
          echo '87a47362d898bb8485bdb231199f7c93dd2f021de6cb42caa7238458cd418de3  .work/shared-v2.html' | sha256sum --check
      - name: Configure software WebGL2
        run: |
          CHROME=$(command -v google-chrome || command -v chromium)
          test -n "$CHROME"
          printf '#!/bin/bash\nexec "%s" --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader "$@"\n' "$CHROME" > .work/chrome
          chmod +x .work/chrome
          echo "CHROME_PATH=$PWD/.work/chrome" >> "$GITHUB_ENV"
      - name: Desktop WebGL2
        id: desktop
        continue-on-error: true
        run: node .work/skill/scripts/qa_html.mjs --html ".work/v2/$RESORT.html" --out .work/desktop --width 960 --height 540 --backend webgl2 --timeout 180 --probe .work/skill/scripts/smoke_probe.js
      - name: Mobile portrait
        id: portrait
        continue-on-error: true
        run: node .work/skill/scripts/qa_html.mjs --html ".work/v2/$RESORT.html" --out .work/portrait --width 390 --height 844 --mobile --backend webgl2 --timeout 180 --probe scripts/mobile_probe.js
      - name: Mobile landscape
        id: landscape
        continue-on-error: true
        run: node .work/skill/scripts/qa_html.mjs --html ".work/v2/$RESORT.html" --out .work/landscape --width 844 --height 390 --mobile --backend webgl2 --timeout 180 --probe scripts/mobile_probe.js
      - name: Preserve candidate and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RESORT }}-v2-candidate
          path: |
            .work/v2/
            .work/shared-v2.html
            .work/desktop/
            .work/portrait/
            .work/landscape/
          if-no-files-found: warn
          retention-days: 30
      - name: Require all basic browser gates
        if: always()
        run: |
          test "${{ steps.desktop.outcome }}" = success
          test "${{ steps.portrait.outcome }}" = success
          test "${{ steps.landscape.outcome }}" = success
