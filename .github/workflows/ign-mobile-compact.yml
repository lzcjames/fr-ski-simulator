name: IGN mobile and lossless packaging
on:
  workflow_dispatch:
    inputs:
      data_run:
        description: Successful IGN workflow run
        default: '45498926509'
        required: true
  push:
    paths:
      - '.github/workflows/ign-mobile-compact.yml'
      - 'scripts/grid_codec.py'
      - 'scripts/grid_codec.js'
      - 'tests/test_grid_codec.py'
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        resort: [les-deux-alpes, alpe-d-huez]
        viewport: [portrait, landscape]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESORT: ${{ matrix.resort }}
      VIEWPORT: ${{ matrix.viewport }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.resort }}-ign-preview
          path: .work/input
          run-id: ${{ inputs.data_run || '45498926509' }}
          github-token: ${{ github.token }}
      - name: Verify and build compact IGN game
        run: |
          python tests/test_grid_codec.py -v
          python tests/test_engine_v1.py -v
          DATA=$(find .work/input -type f -name layered-data.json)
          test -f "$DATA"
          python scripts/resolve_template.py --download --out .work/original.html
          python scripts/engine_v1.py compile --template .work/original.html --out .work/shared.html
          python scripts/engine_v1.py pack --engine .work/shared.html --config "resorts/$RESORT/config.json" --data "$DATA" --out .work/raw.html
          python scripts/engine_v1.py pack --engine .work/shared.html --config "resorts/$RESORT/config.json" --data "$DATA" --out ".work/compact/$RESORT.html" --compact-heights
          python scripts/check_engine_bundle.py --engine .work/shared.html --game ".work/compact/$RESORT.html" --config "resorts/$RESORT/config.json" --data "$DATA" --compact-heights
          python -c 'from pathlib import Path; import os,json; a=Path(".work/raw.html").stat().st_size;b=Path(".work/compact/"+os.environ["RESORT"]+".html").stat().st_size;print(json.dumps({"rawBytes":a,"compactBytes":b,"savedBytes":a-b})); assert b<a'
      - name: Prepare upstream probe and software GPU
        run: |
          git clone https://github.com/awoele/ski-resort-to-game.git .work/skill
          git -C .work/skill checkout --detach 4f64120bb085d1dc8f8978b9cb65cf7e9e92fcd1
          cp scripts/mobile_probe.js .work/mobile-probe.js
          CHROME=$(command -v google-chrome || command -v chromium)
          test -n "$CHROME"
          printf '#!/bin/bash\nexec "%s" --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader "$@"\n' "$CHROME" > .work/chrome-software
          chmod +x .work/chrome-software
          echo "CHROME_PATH=$PWD/.work/chrome-software" >> "$GITHUB_ENV"
      - name: Mobile browser smoke and frame cadence
        run: |
          GAME=".work/compact/$RESORT.html"
          test -f "$GAME"
          if [ "$VIEWPORT" = portrait ]; then WIDTH=390; HEIGHT=844; else WIDTH=844; HEIGHT=390; fi
          node .work/skill/scripts/qa_html.mjs --html "$GAME" --out .work/mobile-qa --width "$WIDTH" --height "$HEIGHT" --mobile --backend webgl2 --timeout 180 --probe .work/mobile-probe.js
      - name: Print diagnostic report
        if: always()
        run: |
          if test -f .work/mobile-qa/report.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('.work/mobile-qa/report.json').read_text())
          print(json.dumps({k:r.get(k) for k in ('passed','readyMs','game','probe','metrics','error','exceptions','consoleErrors')},indent=2))
          PY
          fi
      - name: Preserve mobile QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.resort }}-${{ matrix.viewport }}-ign-compact
          path: |
            .work/mobile-qa/
            .work/compact/
          if-no-files-found: warn
          retention-days: 14
